<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18388610233"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18388610233');
  /* Trafico interno: entrar una vez con ?interno=1 marca este navegador y ?interno=0 lo desmarca */
  var planiappInterno = false;
  try {
    if (/[?&]interno=1(&|$)/.test(location.search)) localStorage.setItem('planiapp_interno', '1');
    if (/[?&]interno=0(&|$)/.test(location.search)) localStorage.removeItem('planiapp_interno');
    planiappInterno = localStorage.getItem('planiapp_interno') === '1';
  } catch (e) {}
  gtag('config', 'G-L8TDJPFVRM', planiappInterno ? { traffic_type: 'internal' } : {});
  /* Origen del visitante: la última fuente externa (buscador, anuncio, red social o enlace con utm). Los formularios lo envían con el lead. */
  try {
    (function () {
      var q = new URLSearchParams(location.search), r = document.referrer, h = '', o = '';
      try { h = r ? new URL(r).hostname.replace(/^www\./, '') : ''; } catch (e) {}
      var us = q.get('utm_source') || '', pago = /cpc|ppc|paid|ads/.test((q.get('utm_medium') || '').toLowerCase());
      var may = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
      if (q.get('gclid') || q.get('gbraid') || q.get('wbraid')) o = 'Google Ads';
      else if (us) o = pago ? 'Anuncio ' + may(us) : may(us) + ' (enlace)';
      else if (q.get('fbclid')) o = 'Facebook o Instagram';
      else if (h && h !== location.hostname.replace(/^www\./, '')) {
        o = /gemini\.google\./.test(h) ? 'Gemini'
          : /(^|\.)google\./.test(h) || /googlequicksearchbox/.test(r) ? 'Google (SEO)'
          : /bing\.|yahoo\.|duckduckgo\.|ecosia\./.test(h) ? 'Otro buscador (SEO)'
          : /instagram\./.test(h) ? 'Instagram'
          : /facebook\.|fb\.me/.test(h) ? 'Facebook'
          : /whatsapp|wa\.me/.test(h) ? 'WhatsApp'
          : /chatgpt\.|openai\./.test(h) ? 'ChatGPT'
          : /perplexity\./.test(h) ? 'Perplexity'
          : /copilot\.microsoft\./.test(h) ? 'Copilot'
          : /(^|\.)claude\.ai$/.test(h) ? 'Claude'
          : 'Otro sitio: ' + h;
      }
      var antes = localStorage.getItem('planiapp_origen');
      if (o || !antes) localStorage.setItem('planiapp_origen', JSON.stringify({ o: o || 'Directo', p: location.pathname, t: Date.now() }));
    })();
  } catch (e) {}
  window.planiappOrigen = function () { try { var g = JSON.parse(localStorage.getItem('planiapp_origen') || 'null'); return g ? g.o + ' · entró por ' + (g.p === '/' ? 'la portada' : g.p) : 'Directo'; } catch (e) { return ''; } };
</script>
<script>
